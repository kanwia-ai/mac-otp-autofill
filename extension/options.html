<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Messages OTP Autofill</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        max-width: 460px; margin: 40px auto; padding: 0 20px;
      }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p.sub { margin: 0 0 24px; opacity: .65; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      input[type="text"], input[type="number"] {
        width: 100%; padding: 7px 9px; border-radius: 7px;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        background: transparent; color: inherit; font: inherit;
      }
      .row { display: flex; align-items: center; gap: 8px; margin: 20px 0; }
      .row label { margin: 0; }
      button { font: inherit; padding: 7px 14px; border-radius: 7px; cursor: pointer; }
      #status { margin-top: 16px; min-height: 20px; }
      .ok { color: #128a3c; } .bad { color: #c0392b; }
      code { background: color-mix(in srgb, currentColor 10%, transparent); padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Messages OTP Autofill</h1>
    <p class="sub">Reads codes from the local watcher daemon. Fills the field; never submits.</p>

    <div class="row">
      <input type="checkbox" id="enabled" />
      <label for="enabled">Autofill enabled</label>
    </div>

    <label for="port">Daemon port</label>
    <input type="number" id="port" min="1" max="65535" />

    <label for="token">Shared token</label>
    <input type="text" id="token" spellcheck="false" placeholder="generated by setup.sh" />

    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test connection</button>
    </div>
    <div id="status"></div>

    <p class="sub" style="margin-top: 28px">
      Token lives in <code>~/.config/otp-autofill/config.json</code>. If they disagree,
      re-run <code>setup.sh</code>.
    </p>

    <script src="options.js"></script>
  </body>
</html>
